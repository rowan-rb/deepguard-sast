[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deepguard"
version = "0.1.0"
description = "A Static Application Security Testing (SAST) tool for AI-generated code."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0"
]

[project.scripts]
deepguard = "deepguard.cli:app"

[tool.setuptools.packages.find]
where = ["src"]